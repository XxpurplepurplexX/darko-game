<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Runner</title>
<style>
  :root {
    --bg: #1A0A2E;
    --pink: #FF69B4;
    --green: #39FF14;
    --cyan: #38B6FF;
    --yellow: #FFE600;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }

  /* Game area: 9:16 portrait. Phones: full width. Wider screens: max 600px, centered, dark purple
     on the sides. The transform makes "fixed" children position against the stage, not the window.
     --u is 1% of the stage width, so every size scales with the game area. */
  #stage {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    width: min(600px, 100vw, calc(100vh * 9 / 16));
    width: min(600px, 100vw, calc(100dvh * 9 / 16));
    transform: translateX(-50%);
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(255, 105, 180, .25);
    --u: min(1vw, 6px);
  }
  @supports (width: 1cqw) { #stage { container-type: size; --u: 1cqw; } }
  @media (max-width: 600px) and (pointer: coarse) { #stage { width: 100vw; } }

  #game, #burst { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #burst { z-index: 5; pointer-events: none; }

  /* ---------- HUD ---------- */
  #score {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(var(--u) * 4);
    font-size: calc(var(--u) * 8);
    font-weight: 900;
    line-height: 1.1;
    color: var(--green);
    text-shadow: 0 0 10px var(--green), 0 0 22px rgba(57, 255, 20, .5);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    transform-origin: right center;
  }
  #score.pop { animation: scorePop .28s ease-out; }
  @keyframes scorePop { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  #toast {
    position: fixed;
    z-index: 8;
    top: calc(var(--u) * 22);
    left: 50%;
    max-width: 90%;
    padding: .5em 1em;
    font-size: calc(var(--u) * 4.2);
    font-weight: 900;
    text-align: center;
    color: var(--bg);
    background: var(--green);
    border-radius: 10px;
    box-shadow: 0 0 16px var(--green);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -10px);
  }
  #toast.show { animation: toast 2.6s ease-out forwards; }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, -12px) scale(.9); }
    10% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
    16% { transform: translate(-50%, 0) scale(1); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -6px); }
  }
  #mute {
    position: fixed;
    z-index: 10;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    width: 44px;
    height: 44px;
    padding: 8px;
    display: grid;
    place-items: center;
    color: var(--pink);
    background: rgba(26, 10, 46, .6);
    border: 2px solid var(--pink);
    border-radius: 10px;
    cursor: pointer;
    filter: drop-shadow(0 0 6px var(--pink));
  }
  #mute svg { width: 100%; height: 100%; }
  #mute .off { display: none; }
  #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: inline; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center;
    gap: calc(var(--u) * 2.6);
    padding: calc(var(--u) * 5);
    text-align: center;
    overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  #start {
    justify-content: flex-start;
    padding-top: calc(var(--u) * 13);
    background: linear-gradient(rgba(26, 10, 46, .78), rgba(26, 10, 46, .45) 62%, rgba(26, 10, 46, 0));
  }
  #over { background: rgba(8, 3, 16, .86); z-index: 6; }
  h1, h2 {
    margin: 0;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--pink);
    text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink), 0 0 46px #ff1493;
  }
  h1 { font-size: calc(var(--u) * 13); line-height: 1; }
  h2 { font-size: calc(var(--u) * 11); line-height: 1; }
  .tagline { margin: 0; font-size: calc(var(--u) * 4.6); color: #e6c8f5; }
  .chips { display: flex; gap: calc(var(--u) * 3); }
  .chip {
    padding: .25em .9em;
    font-size: calc(var(--u) * 4);
    font-weight: 700;
    border: 2px solid rgba(255, 105, 180, .55);
    border-radius: 999px;
    background: rgba(26, 10, 46, .6);
  }
  .chip b { color: var(--green); text-shadow: 0 0 8px var(--green); }
  .chip b.gold { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }
  .daily {
    width: 100%;
    max-width: calc(var(--u) * 80);
    padding: .5em .9em;
    font-size: calc(var(--u) * 3.6);
    border: 2px solid rgba(56, 182, 255, .6);
    border-radius: 12px;
    background: rgba(10, 30, 60, .45);
  }
  .daily .dl { display: block; font-size: .82em; font-weight: 900; letter-spacing: .08em; color: var(--cyan); }
  .daily.done { border-color: var(--green); }
  .daily.done .st { color: var(--green); font-weight: 900; }
  .skins { display: flex; gap: calc(var(--u) * 2.6); align-items: flex-start; padding-bottom: calc(var(--u) * 4); }
  .skin {
    position: relative;
    width: calc(var(--u) * 11.5);
    height: calc(var(--u) * 11.5);
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .35);
    cursor: pointer;
    color: #fff;
    font: inherit;
  }
  .skin[aria-pressed="true"] { border-color: var(--green); box-shadow: 0 0 14px var(--green); }
  .skin.locked { filter: saturate(.25) brightness(.6); }
  .skin .cost {
    position: absolute;
    left: 50%;
    bottom: -1.5em;
    transform: translateX(-50%);
    font-size: calc(var(--u) * 3);
    font-weight: 900;
    color: var(--yellow);
    white-space: nowrap;
    filter: none;
  }
  .skin .lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--u) * 4.5); }
  .help {
    display: flex;
    gap: calc(var(--u) * 6);
    margin-top: calc(var(--u) * 1.5);
    font-size: calc(var(--u) * 3.2);
    color: #e6c8f5;
  }
  .help div { display: flex; flex-direction: column; gap: .15em; }
  .help b { color: var(--pink); letter-spacing: .08em; }

  .btn {
    padding: .7em 1.8em;
    font: inherit;
    font-weight: 900;
    letter-spacing: .05em;
    border-radius: 14px;
    cursor: pointer;
    min-height: 48px;
  }
  .btn.primary {
    font-size: calc(var(--u) * 6);
    color: var(--bg);
    background: var(--green);
    border: 0;
    box-shadow: 0 0 14px var(--green), 0 0 36px rgba(57, 255, 20, .6);
    animation: breathe 1.8s ease-in-out infinite;
  }
  .btn.secondary {
    font-size: calc(var(--u) * 3.8);
    color: var(--pink);
    background: transparent;
    border: 2px solid var(--pink);
    box-shadow: 0 0 10px rgba(255, 105, 180, .5);
  }
  .btn.secondary:hover { background: rgba(255, 105, 180, .15); }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible, .skin:focus-visible, #mute:focus-visible, #controls button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  /* ---------- Game over ---------- */
  #record {
    margin: 0;
    font-size: calc(var(--u) * 9);
    font-weight: 900;
    letter-spacing: .05em;
    animation: neonRecord 1s ease-in-out infinite;
  }
  #record[hidden] { display: none; }
  .final { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .final .lbl { font-size: calc(var(--u) * 3.6); letter-spacing: .15em; color: #e6c8f5; }
  .final b {
    font-size: calc(var(--u) * 19);
    color: var(--green);
    text-shadow: 0 0 12px var(--green), 0 0 30px rgba(57, 255, 20, .6);
    font-variant-numeric: tabular-nums;
  }
  dl.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: calc(var(--u) * 2.4) calc(var(--u) * 4);
    width: 100%;
    max-width: calc(var(--u) * 78);
    margin: 0;
  }
  dl.grid div { padding: .4em .5em; border: 1px solid rgba(255, 105, 180, .35); border-radius: 10px; background: rgba(26, 10, 46, .6); }
  dl.grid dt { font-size: calc(var(--u) * 2.9); letter-spacing: .1em; color: #e6c8f5; }
  dl.grid dd { margin: 0; font-size: calc(var(--u) * 6); font-weight: 900; font-variant-numeric: tabular-nums; }
  #dailyDone { margin: 0; font-size: calc(var(--u) * 3.6); font-weight: 900; color: var(--green); }
  #dailyDone[hidden] { display: none; }
  .share-wrap { position: relative; }
  #tip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    padding: .35em .8em;
    font-weight: 900;
    color: var(--bg);
    background: var(--green);
    border-radius: 8px;
    box-shadow: 0 0 12px var(--green);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 6px);
  }
  #tip.show { animation: tip 1.8s ease-out forwards; }
  @keyframes tip {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(.9); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    25% { transform: translate(-50%, 0) scale(1); }
    80% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -8px); }
  }
  #shareFallback {
    width: 100%;
    max-width: calc(var(--u) * 80);
    padding: .5em;
    font: inherit;
    font-size: calc(var(--u) * 3);
    color: #fff;
    background: rgba(26, 10, 46, .9);
    border: 2px solid var(--cyan);
    border-radius: 8px;
    user-select: text;
    -webkit-user-select: text;
  }
  #shareFallback[hidden] { display: none; }
  @keyframes neonRecord {
    0%, 100% { color: var(--green); opacity: 1; transform: scale(1); text-shadow: 0 0 10px var(--green), 0 0 28px var(--green), 0 0 60px var(--green); }
    50% { color: var(--pink); opacity: .65; transform: scale(1.08); text-shadow: 0 0 10px var(--pink), 0 0 28px #ff1493, 0 0 60px #ff1493; }
  }

  /* ---------- Touch controls (touch devices only, while playing) ---------- */
  #controls { display: none; }
  @media (pointer: coarse) {
    #controls:not([hidden]) {
      position: fixed;
      z-index: 4;
      left: 0; right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom));
      padding: 0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
  }
  #controls button {
    pointer-events: auto;
    width: 76px;
    height: 76px;
    padding: 16px;
    color: var(--pink);
    background: rgba(26, 10, 46, .45);
    border: 2px solid var(--pink);
    border-radius: 18px;
    opacity: .55;
    touch-action: none;
  }
  #controls button:active { opacity: .95; background: rgba(255, 105, 180, .3); }
  #controls svg { width: 100%; height: 100%; display: block; }

  /* Phone held sideways: the game is portrait-only */
  #rotate {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    background: var(--bg);
    color: var(--pink);
    font-size: 1.4rem;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 12px var(--pink);
  }
  #rotate p { margin: 0; }
  #rotate .sub { font-size: 1rem; font-weight: 400; color: #e6c8f5; text-shadow: none; }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) { #rotate { display: flex; } }

  @media (prefers-reduced-motion: reduce) {
    #record, .btn.primary, #score.pop { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" role="img" data-ta="canvasLabel"></canvas>
  <div id="score" aria-hidden="true" hidden>0</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false" data-ta="muteOn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="off" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>

  <!-- Main menu -->
  <div id="start" class="overlay">
    <h1 data-t="title"></h1>
    <p class="tagline" data-t="tagline"></p>
    <div class="chips">
      <span class="chip"><span data-t="best"></span> <b id="menuBest">0</b></span>
      <span class="chip"><span data-t="coins"></span> <b id="menuCoins" class="gold">0</b></span>
    </div>
    <div id="daily" class="daily"><span class="dl" data-t="daily"></span><span id="dailyText"></span> <span id="dailyState" class="st"></span></div>
    <div id="skins" class="skins" role="group" data-ta="skinsLabel"></div>
    <button id="play" type="button" class="btn primary" data-t="play"></button>
    <div class="help">
      <div><b data-t="helpDesktop"></b><span data-t="helpMoveD"></span><span data-t="helpJumpD"></span></div>
      <div><b data-t="helpMobile"></b><span data-t="helpMoveM"></span><span data-t="helpJumpM"></span></div>
    </div>
  </div>

  <!-- Touch buttons -->
  <div id="controls" hidden>
    <button type="button" id="btnLeft" data-ta="left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" id="btnJump" data-ta="jump">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <button type="button" id="btnRight" data-ta="right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <canvas id="burst" aria-hidden="true"></canvas>

  <!-- Game over -->
  <div id="over" class="overlay" role="alertdialog" aria-labelledby="overTitle" hidden>
    <h2 id="overTitle" data-t="gameOver"></h2>
    <p id="record" role="status" data-t="newHigh" hidden></p>
    <div class="final"><span class="lbl" data-t="finalScore"></span><b id="finalScore">0</b></div>
    <dl class="grid">
      <div><dt data-t="bestScore"></dt><dd id="bestScore">0</dd></div>
      <div><dt data-t="runCoins"></dt><dd id="runCoins">0</dd></div>
      <div><dt data-t="maxCombo"></dt><dd id="runCombo">x1</dd></div>
      <div><dt data-t="survival"></dt><dd id="runTime">0:00</dd></div>
    </dl>
    <p id="dailyDone" hidden></p>
    <button id="again" type="button" class="btn primary" data-t="again"></button>
    <div class="share-wrap">
      <button id="share" type="button" class="btn secondary" data-t="share"></button>
      <span id="tip" role="status" aria-live="polite"></span>
    </div>
    <input id="shareFallback" type="text" readonly hidden data-ta="shareFallbackLabel">
  </div>
</div>

<div id="rotate" role="alert">
  <p data-t="rotate"></p>
  <p class="sub" data-t="rotateSub"></p>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     1. CONFIGURATION
     All gameplay numbers live here so balancing never means hunting in code.
     ===================================================================== */
  const COLORS = {
    bg: '#1A0A2E', road: '#2A1248', roadAlt: '#331659',
    pink: '#FF69B4', deepPink: '#FF1493', yellow: '#FFE600', green: '#39FF14', cyan: '#38B6FF', orange: '#FF9500'
  };
  const PZ = 1;              // depth of the player (camera looks down the road toward larger z)
  const FAR = 14;            // depth where obstacles/coins appear
  const ZMAX = 90, ZMIN = 0.55; // road is drawn between these depths
  const MAX_SPEED = 8.5;     // depth units per second at 100% speed
  const START_SPEED = 0.62;  // run starts at 62% of max (gentle opening)
  const LANE_TIME = 0.1;     // seconds to change one lane
  const JUMP_UP = 0.3, JUMP_HANG = 0.1, JUMP_DOWN = 0.3; // seconds
  const JUMP_PX = 0.9;       // jump height in lane widths
  const CLEAR_H = 0.65;      // jump height fraction needed to clear a low obstacle
  const HIT_HALF = 0.52;     // hitbox: lateral half-width (lanes) -- independent from the sprite
  const HIT_DEPTH = 0.2;     // hitbox: depth tolerance
  const NEAR_DX = 0.82;      // lateral distance under which a pass counts as a near miss
  const NEAR_CLEAR = 0.1;    // clearing a low obstacle by less than this jump fraction = near miss
  const NEAR_BONUS = 25, NEAR_COOLDOWN = 0.4;
  const COIN_PICK = 0.62;
  const COMBO_WINDOW = 2, COMBO_MAX = 5;
  const MAGNET_TIME = 5, MAGNET_PULL = 7;
  const SHIELD_INVULN = 0.7; // grace time after the shield breaks
  const POWERUP_EVERY = [30, 45]; // seconds between power-ups (rare)
  const SWIPE_MIN = 30;      // px
  const DEATH_TIME = 0.85;   // seconds between the hit and the game-over screen
  const CHALLENGE_REWARD = 50;
  const BEST_KEY = 'neonRunnerBest';
  const GAME_URL = 'https://darko-game.vercel.app'; // fixed link used when sharing, wherever the page is opened

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const TAU = Math.PI * 2;
  const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
  const hash = n => { n = Math.imul(n ^ 61, 0x45d9f3b) ^ (n >>> 16); n = Math.imul(n, 0x45d9f3b); n ^= n >>> 15; return (n >>> 0) / 4294967296; };

  // Difficulty 0..1 over time: easy to 20s, moderate to 45s, harder to 90s, difficult but fair after.
  function difficulty(t) {
    if (t < 20) return 0.2 * t / 20;
    if (t < 45) return 0.2 + 0.3 * (t - 20) / 25;
    if (t < 90) return 0.5 + 0.4 * (t - 45) / 45;
    return Math.min(1, 0.9 + 0.1 * (t - 90) / 90);
  }

  /* =====================================================================
     2. TEXT (English / Italian). The language follows the browser; ?lang=it|en overrides.
     ===================================================================== */
  const LANG = ((new URLSearchParams(location.search).get('lang')) || navigator.language || 'en').toLowerCase().startsWith('it') ? 'it' : 'en';
  const STR = {
    en: {
      title: 'NEON RUNNER', tagline: 'How far can you go?', play: 'PLAY', best: 'BEST', coins: 'COINS',
      daily: 'DAILY CHALLENGE', completed: 'Completed!', reward: '(+{n} coins)',
      c_score: 'Reach 1,000 points', c_coins: 'Collect 50 coins', c_time: 'Survive 60 seconds',
      c_combo: 'Reach x5 combo', c_near: 'Perform 5 near misses',
      helpDesktop: 'DESKTOP', helpMoveD: '← → / A D = Move', helpJumpD: 'SPACE = Jump',
      helpMobile: 'MOBILE', helpMoveM: 'Swipe = Move', helpJumpM: 'Swipe Up = Jump',
      gameOver: 'GAME OVER', newHigh: 'NEW HIGH SCORE!', finalScore: 'FINAL SCORE', bestScore: 'BEST SCORE',
      runCoins: 'COINS', maxCombo: 'MAX COMBO', survival: 'SURVIVAL TIME', again: 'PLAY AGAIN', share: 'SHARE SCORE',
      copied: 'Copied!', copyFail: 'Copy the text below', nearMiss: 'NEAR MISS!', maxComboFx: 'MAX COMBO!',
      challengeDone: 'Daily challenge complete! +{n} coins', challengeDoneShort: 'Daily challenge complete! +{n} coins',
      unlocked: 'Unlocked: {name}', needCoins: 'Need {n} more coins', selected: 'Selected: {name}',
      muteOn: 'Mute audio', muteOff: 'Unmute audio', left: 'Move left', jump: 'Jump', right: 'Move right',
      canvasLabel: 'Neon Runner game area', skinsLabel: 'Runner skins', shareFallbackLabel: 'Score text to copy',
      rotate: 'Rotate your phone to portrait', rotateSub: 'The game is paused until you do',
      locked: 'locked', shareText: "🏃 I scored {score} in Olivia's Neon Runner! Can you beat me? 🎮 {url}",
      skin_default: 'Default', skin_pink: 'Pink Neon', skin_cyber: 'Cyber Runner', skin_gold: 'Golden', skin_shadow: 'Shadow'
    },
    it: {
      title: 'NEON RUNNER', tagline: 'Fin dove arrivi?', play: 'GIOCA', best: 'RECORD', coins: 'MONETE',
      daily: 'SFIDA DEL GIORNO', completed: 'Completata!', reward: '(+{n} monete)',
      c_score: 'Raggiungi 1.000 punti', c_coins: 'Raccogli 50 monete', c_time: 'Sopravvivi 60 secondi',

  function audio() {

      const ir = actx.createBuffer(2, len, actx.sampleRate);
      for (let c = 0; c < 2; c++) {

        for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
      const conv = actx.createConvolver();
      conv.buffer = ir;
      reverbIn = actx.createGain();
      reverbIn.gain.value = 0.7;
      reverbIn.connect(conv); conv.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;

  function tone(freq, endFreq, dur, type, vol, delay, send) {
    const a = audio(); if (!a || muted) return;

    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(master);
    if (send) { const s = a.createGain(); s.gain.value = send; g.connect(s); s.connect(reverbIn); }
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);

  const MUSIC_VOL = 0.2;
  const STEP_SEC = 60 / 138 / 4;
  const CHORDS_A = [ // Am F C G
    { bass: 55.00, arp: [440.00, 523.25, 659.25] }, { bass: 43.65, arp: [349.23, 440.00, 523.25] },
    { bass: 65.41, arp: [523.25, 659.25, 783.99] }, { bass: 49.00, arp: [392.00, 493.88, 587.33] }
  ];
  const CHORDS_B = [ // Dm F Am E
    { bass: 73.42, arp: [293.66, 349.23, 440.00] }, { bass: 43.65, arp: [349.23, 440.00, 523.25] },
    { bass: 55.00, arp: [440.00, 523.25, 659.25] }, { bass: 82.41, arp: [415.30, 493.88, 659.25] }
  ];
  const LEAD = [ // one 16-step phrase per bar of the 8-bar loop (0 = rest)
    [659.25,0,0,784,0,0,880,0, 784,0,659.25,0,0,0,0,0], [698.46,0,0,880,0,0,1046.5,0, 880,0,698.46,0,0,0,0,0],
    [784,0,0,1046.5,0,0,1318.5,0, 1046.5,0,784,0,0,0,0,0], [587.33,0,659.25,0,784,0,987.77,0, 784,0,659.25,0,587.33,0,0,0],
    [587.33,0,0,698.46,0,0,880,0, 698.46,0,587.33,0,0,0,0,0], [698.46,0,0,880,0,0,1046.5,0, 880,0,698.46,0,0,0,0,0],
    [659.25,0,784,0,880,0,1046.5,0, 880,0,784,0,659.25,0,0,0], [659.25,0,830.6,0,987.77,0,830.6,0, 659.25,0,0,0,0,0,0,0]

  const music = { timer: 0, gain: null, step: 0, next: 0 };

  function mNote(freq, t0, dur, type, vol, cutoff) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = type; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = cutoff;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(music.gain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function mNoise(t0, dur, vol, type, freq) {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(music.gain);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
  }
  function musicStep(s, t0) {
    const bars = (s >> 4) & 7, i = s & 15, c = (bars < 4 ? CHORDS_A : CHORDS_B)[bars & 3];
    const level = difficulty(run.time) < 0.3 ? 0 : difficulty(run.time) < 0.7 ? 1 : 2; // the music builds with the run
    if (i % 4 === 0) { // kick
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(150, t0);
      o.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
      g.gain.setValueAtTime(0.9, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
      o.connect(g); g.connect(music.gain);
      o.start(t0); o.stop(t0 + 0.2);
    }
    if (i === 4 || i === 12) mNoise(t0, 0.12, 0.45, 'bandpass', 1800);
    if (i % 2 === 0) mNoise(t0, i === 14 ? 0.12 : 0.04, 0.22, 'highpass', 7000);
    else if (level >= 1) mNoise(t0, 0.03, 0.1, 'highpass', 9000);
    if (i % 2 === 0) mNote(i % 4 === 2 ? c.bass * 2 : c.bass, t0, STEP_SEC * 1.7, 'sawtooth', 0.4, 600);
    const oct = bars >= 2 && i >= 8 ? 2 : 1;
    mNote(c.arp[[0, 1, 2, 1][i & 3]] * oct, t0, STEP_SEC * 0.9, 'square', 0.12, 3200);
    const lead = LEAD[bars][i];
    if (lead && (bars >= 4 || level >= 2)) mNote(lead, t0, STEP_SEC * 2.2, 'square', 0.1, 2600);
  }
  function musicTick() {
    if (!actx) return;
    if (music.next < actx.currentTime - 0.1) music.next = actx.currentTime;
    while (music.next < actx.currentTime + 0.15) {
      if (!muted) musicStep(music.step, music.next);
      music.step = (music.step + 1) % 128;
      music.next += STEP_SEC;
    }
  }
  function musicStart() {
    const a = audio();

    music.gain.gain.linearRampToValueAtTime(MUSIC_VOL, a.currentTime + 0.4);
    music.gain.connect(master);
    music.step = 0;
    music.next = a.currentTime + 0.1;
    music.timer = setInterval(musicTick, 25);
  }
  function musicStop() {

    g.gain.cancelScheduledValues(t0);
